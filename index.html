<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crave Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#C8102E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Crave Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link href="https://fonts.googleapis.com/css2?family=Hind:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F2F4F0;--card:#fff;--ink:#14231C;--mute:#5F6F66;--line:#DDE3DC;--red:#C8102E;--on:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101814;--card:#18231D;--ink:#EAF1EC;--mute:#93A399;--line:#26352C;--red:#F0475F}}
:root[data-theme="dark"]{--bg:#101814;--card:#18231D;--ink:#EAF1EC;--mute:#93A399;--line:#26352C;--red:#F0475F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Hind',system-ui,sans-serif;font-size:16px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
header{padding:16px 16px 12px}
h1{margin:0;font-size:24px;font-weight:700}
.sub{color:var(--mute);font-size:14px;margin-top:6px}
.search{margin:10px 16px;display:block;width:calc(100% - 32px);padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:20px;font:inherit;font-size:14px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.list{margin:0 16px;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:14px;padding:14px 14px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;color:inherit;font:inherit;text-align:left;min-height:60px}
.row:last-child{border-bottom:0}
.av{flex:none;width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff;font-size:18px}
.nm{font-weight:500}.ph{color:var(--mute);font-size:14px}
.tag{margin-left:auto;font-size:12px;color:var(--mute);border:1px solid var(--line);padding:2px 8px;border-radius:10px}
.empty{padding:36px 20px;text-align:center;color:var(--mute)}
.fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));background:var(--red);color:#fff;border:0;border-radius:28px;padding:14px 22px;font:inherit;font-weight:700;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.bk{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;z-index:5}
.bk.open{display:flex}
.sheet{background:var(--card);width:100%;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.big{font-size:20px;font-weight:700;margin:0}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:16px 0 10px}
.a{display:block;text-align:center;text-decoration:none;padding:14px;border-radius:12px;font-weight:700;color:#fff;border:0;font:inherit;font-weight:700}
.call{background:#1B6EF3}.wa{background:#1FA855}
.sm{display:flex;gap:10px}
.sm button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:none;color:var(--ink);font:inherit}
.sm .del{color:var(--red)}
label{display:block;margin:14px 0 6px;font-size:15px;color:var(--mute);font-weight:500}
input,select,textarea{width:100%;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1.5}
.save{width:100%;margin-top:16px;padding:16px;border:0;border-radius:12px;background:var(--red);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer}
.foot{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:20px 16px 0;padding-bottom:10px}
.foot button{background:none;border:1px solid var(--line);color:var(--mute);padding:12px 16px;border-radius:10px;font:inherit;font-size:15px;font-weight:500}
.cr{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line)}.dot{width:12px;height:12px;border-radius:50%;flex:none}.cn{flex:1}.cr button{border:1px solid var(--line);background:none;color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}.cr .del{color:var(--red)}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
</style>
</head>
<body>
<header><h1>Crave Tracker</h1><div class="sub" id="cnt"></div></header>
<div style="display:flex;gap:4px;padding:10px 16px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none">
<button class="chip" id="mode-contacts" style="flex:none;border-radius:20px;padding:8px 14px;border:1px solid var(--line);background:var(--red);color:#fff;border-color:var(--red)">👥 Contacts</button>
<button class="chip" id="mode-tracker" style="flex:none;border-radius:20px;padding:8px 14px;border:1px solid var(--line);background:var(--card);color:var(--ink)">📊 Tracker</button>
</div>

<!-- Contacts Section -->
<div id="section-contacts" style="display:block">
<input class="search" id="q" type="search" placeholder="Search name or number">
<div class="chips" id="chips"></div>
<div class="list" id="list"></div>
</div>

<!-- Tracker Section -->
<div id="section-tracker" style="display:none;padding:16px">
<button class="save" id="open-chatgpt-btn" style="width:100%;background:#10a37f;margin-bottom:16px">🤖 Open ChatGPT & Copy Prompt</button>

<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px;font-size:13px;color:var(--mute)">Paste format: Name: Raj | Amount: 500 | Date: 2026-10-28 | Time: 2:30 PM</div>
<textarea id="tracker-input" rows="5" placeholder="Name: Raj | Amount: 500 | Date: 2026-10-28 | Time: 2:30 PM&#10;Name: Priya | Amount: 300 | Date: 2026-10-28 | Time: 3:15 PM" style="width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;font-size:13px;resize:vertical"></textarea>
<button class="save" id="tracker-add" style="width:100%;margin-top:10px">➕ Add Data</button>
<button class="save" id="tracker-clear" style="width:100%;margin-top:8px;background:var(--card);color:var(--ink);border:1px solid var(--line)">🗑️ Clear All</button>

<div style="margin-top:20px">
<h3 style="margin:0 0 10px;font-size:16px">📈 Analytics</h3>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">
<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px">
<div style="color:var(--mute);font-size:12px">Total Customers</div>
<div style="font-size:22px;font-weight:700;color:var(--red);margin-top:4px" id="t-customers">0</div>
</div>
<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px">
<div style="color:var(--mute);font-size:12px">Total Revenue</div>
<div style="font-size:22px;font-weight:700;color:var(--red);margin-top:4px" id="t-total">₹0</div>
</div>
</div>

<h4 style="margin:12px 0 8px;font-size:14px">🏆 Top Spenders</h4>
<div id="t-spenders"></div>

<h4 style="margin:12px 0 8px;font-size:14px">🔄 Most Frequent</h4>
<div id="t-frequent"></div>
</div>
</div>
<div class="foot"><button id="rf">🔄 शीट से रीफ़्रेश</button><button id="imp">📥 पुराने नंबर जोड़ें</button></div>
<input type="file" id="imf" accept=".xlsx,.xls,.csv" hidden>
<button class="fab" id="add">+ नया नंबर</button>

<div class="bk" id="bk"><div class="sheet" id="sheet"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
const PAL=["#C8102E","#1B6EF3","#8A5A00","#6B3FA0","#0E7C66","#D6336C","#2B8A3E","#E8590C","#0B7285","#5C3D2E"];
let CATS=[["ग्राहक",PAL[0]],["वर्कर",PAL[1]],["हेल्पर",PAL[2]],["डीलर",PAL[3]],["सप्लायर",PAL[4]]];
const KEY="crave_contacts_v1",URLK="crave_contacts_api",PAYMENTSKEY="crave_payments_v1",TRACKERKEY="crave_tracker_v1",DEFAULT_API="https://script.google.com/macros/s/AKfycbwxkTBq0UohF9xuiONhwg9vb2U5Z_0mK-h_DijlOaIUmKRShOT0YAv_xomvF-EHE02B7g/exec";
let data=[],payments={},trackerData=[],filter="सभी",api=DEFAULT_API,status="";
try{data=JSON.parse(localStorage.getItem(KEY)||"[]");api=localStorage.getItem(URLK)||DEFAULT_API}catch(e){}
try{payments=JSON.parse(localStorage.getItem(PAYMENTSKEY)||"{}")}catch(e){}
try{trackerData=JSON.parse(localStorage.getItem(TRACKERKEY)||"[]")}catch(e){}
try{const c=JSON.parse(localStorage.getItem("crave_cats_v1")||"null");if(Array.isArray(c)&&c.length)CATS=c}catch(e){}
const cacheCats=()=>{try{localStorage.setItem("crave_cats_v1",JSON.stringify(CATS))}catch(e){}};
const $=id=>document.getElementById(id);
const cache=()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}};
const cachePayments=()=>{try{localStorage.setItem(PAYMENTSKEY,JSON.stringify(payments))}catch(e){}};
const cacheTracker=()=>{try{localStorage.setItem(TRACKERKEY,JSON.stringify(trackerData))}catch(e){}};
const getPayments=id=>payments[id]||[];
const getTotalSpent=id=>{const p=getPayments(id);return p.reduce((sum,x)=>sum+(x.amount||0),0)};
const color=c=>(CATS.find(x=>x[0]===c)||[0,"#555"])[1];
const digits=n=>n.replace(/\D/g,"");
const wa=n=>{let d=digits(n);if(d.length===10)d="91"+d;else if(d.length===11&&d[0]==="0")d="91"+d.slice(1);return "https://wa.me/"+d};
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

function jsonp(params){return new Promise((res,rej)=>{
  const cb="cb"+Date.now()+Math.floor(Math.random()*1e4),s=document.createElement("script");
  const clean=()=>{clearTimeout(t);delete window[cb];s.remove()};
  const t=setTimeout(()=>{clean();rej()},20000);
  window[cb]=r=>{clean();res(r)};s.onerror=()=>{clean();rej()};
  s.src=api+"?"+new URLSearchParams({...params,callback:cb});document.head.appendChild(s)})}
function setStatus(t){status=t;$("cnt").textContent=data.length+" संपर्क"+(t?" • "+t:"")}
function push(p){
  if(!api)return;setStatus("शीट में सेव हो रहा है…");
  jsonp(p).then(r=>setStatus(r&&r.ok?"शीट में सेव हो गया":"शीट में सेव नहीं हुआ")).catch(()=>setStatus("इंटरनेट/शीट लिंक की दिक्कत, दोबारा कोशिश करें"));
}
function load(){
  if(!api){setup();return}
  setStatus("शीट से ला रहे हैं…");
  jsonp({action:"list"}).then(r=>{if(r&&r.ok){data=r.rows;if(Array.isArray(r.cats)&&r.cats.length){CATS=r.cats;cacheCats()}cache();render();setStatus("शीट से अपडेट")}else setStatus("शीट पढ़ नहीं पाए")})
   .catch(()=>setStatus("शीट से नहीं जुड़ पाए (पुराने नंबर दिख रहे हैं)"));
}
function render(){
  const q=$("q").value.trim().toLowerCase();
  $("chips").innerHTML=["सभी",...CATS.map(c=>c[0])].map(c=>{
    const n=c==="सभी"?data.length:data.filter(d=>d.cat===c).length;
    return `<button class="chip ${c===filter?"on":""}" data-c="${c}">${c} (${n})</button>`}).join("")+`<button class="chip" id="mc">✏️ प्रकार</button>`;
  const rows=data.filter(d=>(filter==="सभी"||d.cat===filter)&&(!q||d.name.toLowerCase().includes(q)||d.phone.includes(q)))
    .sort((a,b)=>a.name.localeCompare(b.name,"hi"));
  setStatus(status);
  $("list").innerHTML=rows.length?rows.map(d=>{const total=getTotalSpent(d.id);return `<button class="row" data-id="${d.id}"><span class="av" style="background:${color(d.cat)}">${esc(d.name.trim()[0]||"?")}</span><span><div class="nm">${esc(d.name)}</div><div class="ph">${esc(d.phone)}</div>${total?`<div class="ph" style="font-size:12px;margin-top:2px">💰 ₹${total}</div>`:""}</span><span class="tag">${d.cat}</span></button>`}).join("")
    :`<div class="empty">${data.length?"कोई संपर्क नहीं मिला":"अभी कोई नंबर नहीं है। नीचे \"+ नया नंबर\" दबाकर पहला संपर्क जोड़ें।"}</div>`;
}
const open=h=>{$("sheet").innerHTML=h;$("bk").classList.add("open")};
const close=()=>$("bk").classList.remove("open");
function setup(){
  open(`<p class="big">Google Sheet जोड़ें</p><div class="ph" style="margin-top:6px">Apps Script की Web app वाली लिंक (https://script.google.com/macros/s/.../exec) यहाँ चिपकाएँ।</div>
  <label>Web app लिंक</label><input id="fu" type="url" value="${esc(api)}" placeholder="https://script.google.com/macros/s/.../exec">
  <button class="save" id="su">लिंक सेव करें</button>`);
}
function view(id){
  const d=data.find(x=>x.id===id);if(!d)return;
  const total=getTotalSpent(id),pays=getPayments(id);
  const payHtml=pays.length?pays.sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);align-items:center"><div><div class="nm">₹${p.amount}</div><div class="ph" style="font-size:12px">${new Date(p.date).toLocaleDateString('hi-IN')}</div></div><button class="del" style="padding:4px 8px;font-size:12px" data-dp="${id}|${p.date}">हटाएँ</button></div>`).join(""):`<div class="ph" style="padding:8px 0">कोई भुगतान नहीं</div>`;
  open(`<p class="big">${esc(d.name)}</p><div class="ph">${esc(d.phone)} • ${d.cat}</div>${d.note?`<div class="ph" style="margin-top:6px">${esc(d.note)}</div>`:""}
  <div style="margin-top:12px;padding:12px;background:var(--line);border-radius:10px"><div class="ph">कुल खर्च</div><div style="font-size:20px;font-weight:700;color:var(--red)">₹${total}</div></div>
  <div style="margin-top:12px"><label style="display:block;margin:0 0 8px 0">भुगतान का इतिहास</label><div style="border:1px solid var(--line);border-radius:10px;padding:10px;max-height:200px;overflow-y:auto">${payHtml}</div></div>
  <button class="save" id="addpay" data-id="${id}" style="margin-top:12px">💰 भुगतान जोड़ें</button>
  <div class="acts"><a class="a call" href="tel:${digits(d.phone)}">📞 कॉल करें</a><a class="a wa" href="${wa(d.phone)}" target="_blank" rel="noopener">💬 WhatsApp</a></div>
  <div class="sm"><button data-e="${id}">बदलें</button><button class="del" data-d="${id}">हटाएँ</button><button id="cl">बंद करें</button></div>`);
}
function form(id){
  const d=data.find(x=>x.id===id)||{name:"",phone:"",cat:filter==="सभी"?"ग्राहक":filter,note:""};
  open(`<p class="big">${id?"संपर्क बदलें":"नया संपर्क"}</p>
  <label>नाम</label><input id="fn" value="${esc(d.name)}">
  <label>मोबाइल नंबर</label><input id="fp" type="tel" inputmode="tel" value="${esc(d.phone)}">
  <label>किस तरह का संपर्क</label><select id="fc">${CATS.map(c=>`<option ${c[0]===d.cat?"selected":""}>${c[0]}</option>`).join("")}</select>
  <label>नोट (चाहें तो)</label><input id="fo" value="${esc(d.note)}">
  <button class="save" id="sv" data-id="${id||""}">सेव करें</button>`);
}
function addPaymentForm(id){
  open(`<p class="big">भुगतान दर्ज करें</p>
  <label>रकम (₹)</label><input id="payamt" type="number" inputmode="decimal" placeholder="100">
  <label>तारीख</label><input id="paydate" type="date" value="${new Date().toISOString().split('T')[0]}">
  <button class="save" id="savepay" data-id="${id}">✅ भुगतान सेव करें</button>
  <div class="sm" style="margin-top:10px"><button id="cl">रद्द करें</button></div>`);
}
function parseTrackerInput(text){
  const lines=text.split('\n').filter(x=>x.trim());
  const trans=[];
  lines.forEach(line=>{
    const parts={};
    line.split('|').forEach(p=>{
      const [k,v]=p.split(':');
      const key=k.trim().toLowerCase();
      const val=v.trim();
      if(key.includes('name'))parts.name=val;
      else if(key.includes('amount'))parts.amount=parseFloat(val)||0;
      else if(key.includes('date'))parts.date=val;
      else if(key.includes('time'))parts.time=val;
    });
    if(parts.name&&parts.amount)trans.push({...parts,id:Date.now()+Math.random()});
  });
  return trans;
}
function renderTracker(){
  const byName={};
  trackerData.forEach(t=>{
    if(!byName[t.name])byName[t.name]={total:0,count:0,dates:[]};
    byName[t.name].total+=t.amount;
    byName[t.name].count+=1;
    byName[t.name].dates.push(t.date);
  });

  const totalAmt=Object.values(byName).reduce((s,x)=>s+x.total,0);
  $("t-customers").textContent=Object.keys(byName).length;
  $("t-total").textContent="₹"+totalAmt;

  const spenders=Object.entries(byName).sort((a,b)=>b[1].total-a[1].total).slice(0,5);
  $("t-spenders").innerHTML=spenders.map(([name,data])=>
    `<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer" onclick="showTrackerDetail('${name}')">
      <div style="font-weight:500">${name}</div>
      <div style="display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--mute)">
        <span>💰 ₹${data.total}</span>
        <span>📊 ${data.count} times</span>
      </div>
    </div>`
  ).join("")||"<div style='color:var(--mute);padding:10px'>No data</div>";

  const frequent=Object.entries(byName).sort((a,b)=>b[1].count-a[1].count).slice(0,5);
  $("t-frequent").innerHTML=frequent.map(([name,data])=>
    `<div style="background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer" onclick="showTrackerDetail('${name}')">
      <div style="font-weight:500">${name}</div>
      <div style="display:flex;gap:12px;margin-top:6px;font-size:12px;color:var(--mute)">
        <span>🔄 ${data.count} times</span>
        <span>💰 ₹${data.total}</span>
      </div>
    </div>`
  ).join("")||"<div style='color:var(--mute);padding:10px'>No data</div>";
}
function showTrackerDetail(name){
  const cusTrans=trackerData.filter(t=>t.name===name).sort((a,b)=>new Date(b.date)-new Date(a.date));
  const total=cusTrans.reduce((s,t)=>s+t.amount,0);

  open(`<p class="big">${esc(name)}</p>
  <div style="margin-top:12px;padding:12px;background:var(--line);border-radius:10px">
    <div class="ph">Total Spent</div>
    <div style="font-size:20px;font-weight:700;color:var(--red)">₹${total}</div>
  </div>
  <div style="margin-top:12px">
    <label style="display:block;margin:0 0 8px 0">Transaction History</label>
    <div style="border:1px solid var(--line);border-radius:10px;padding:10px;max-height:300px;overflow-y:auto">
    ${cusTrans.map(t=>`
      <div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);align-items:center">
        <div>
          <div style="font-weight:500">${t.date}</div>
          <div class="ph" style="font-size:12px">${t.time||"--"}</div>
        </div>
        <div style="font-weight:700;color:var(--red)">₹${t.amount}</div>
      </div>
    `).join("")}
    </div>
  </div>
  <div class="sm" style="margin-top:14px"><button id="cl">Close</button></div>`);
}
function parseCustomerData(text){
  const lines=text.split('\n');
  const data={};
  lines.forEach(line=>{
    const [key,...val]=line.split(':');
    const value=val.join(':').trim();
    const cleanKey=key.trim().toLowerCase();
    if(cleanKey.includes('name')||cleanKey.includes('नाम'))data.name=value;
    else if(cleanKey.includes('phone')||cleanKey.includes('नंबर')||cleanKey.includes('मोबाइल'))data.phone=value;
    else if(cleanKey.includes('amount')||cleanKey.includes('रकम'))data.amount=value;
    else if(cleanKey.includes('date')||cleanKey.includes('तारीख'))data.date=value;
  });
  return data;
}

function pushCats(extra){cacheCats();if(!api)return;setStatus("शीट में सेव हो रहा है…");
  jsonp({action:"savecats",cats:JSON.stringify(CATS)}).then(()=>extra?jsonp(extra):0).then(()=>setStatus("शीट में सेव हो गया")).catch(()=>setStatus("इंटरनेट/शीट लिंक की दिक्कत, दोबारा कोशिश करें"))}

function addCat(){const n=$("nc").value.trim();if(!n)return;if(CATS.some(c=>c[0]===n)){alert("यह प्रकार पहले से है");return}
  const used=CATS.map(c=>c[1]);CATS.push([n,PAL.find(x=>!used.includes(x))||PAL[CATS.length%PAL.length]]);pushCats();render();manage()}
function renCat(i){const old=CATS[i][0],n=(prompt("नया नाम लिखें",old)||"").trim();if(!n||n===old)return;
  if(CATS.some(c=>c[0]===n)){alert("यह नाम पहले से है");return}
  CATS[i][0]=n;data.forEach(d=>{if(d.cat===old)d.cat=n});if(filter===old)filter=n;cache();pushCats({action:"renamecat",from:old,to:n});render();manage()}
function delCat(i){const c=CATS[i][0];if(CATS.length<2){alert("कम से कम एक प्रकार रहना चाहिए");return}
  if(data.some(d=>d.cat===c)){alert("\""+c+"\" में अभी संपर्क हैं। पहले उन्हें दूसरे प्रकार में करें, फिर हटाएँ।");return}
  if(!confirm("\""+c+"\" प्रकार हटा दें?"))return;CATS.splice(i,1);if(filter===c)filter="सभी";pushCats();render();manage()}

/* ---- पुराने नंबर Excel/CSV से जोड़ना ---- */
let pend=[];
const last10=v=>{let d=String(v==null?"":v).replace(/\.0+$/,"").replace(/\D/g,"");if(d.length===12&&d.slice(0,2)==="91")d=d.slice(2);if(d.length===11&&d[0]==="0")d=d.slice(1);return /^[6-9]\d{9}$/.test(d)?d:""};
function parseWb(wb){
  const out=[];
  wb.SheetNames.forEach(sn=>{
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[sn],{header:1,raw:true,defval:""});
    if(!rows.length)return;
    const h=rows[0].map(x=>String(x).toLowerCase());
    const ni=h.findIndex(x=>/name|naam|नाम/.test(x)),pi=h.findIndex(x=>/phone|mobile|number|no\.|नंबर|मोबाइल/.test(x));
    rows.slice(1).forEach(r=>{
      let ph="";
      if(pi>=0)ph=last10(r[pi]);
      if(!ph)for(const c of r){ph=last10(c);if(ph)break}
      if(!ph)return;
      let nm=ni>=0?String(r[ni]||"").trim():"";
      if(!nm)nm=(r.map(c=>typeof c==="string"?c.trim():"").find(c=>c&&/\p{L}/u.test(c)&&!/^[0-9a-f]{8}$/i.test(c)&&!/^(yes|no)$/i.test(c)&&!/^\d{4}-\d\d-\d\d/.test(c)&&c!==ph))||"";
      out.push({name:nm||"ग्राहक "+ph.slice(-4),phone:ph});
    });
  });
  return out;
}
async function pickFile(f){
  if(!f)return;
  if(!window.XLSX){alert("फ़ाइल पढ़ने वाली लाइब्रेरी लोड नहीं हुई। इंटरनेट चालू करके दोबारा कोशिश करें।");return}
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const have=new Set(data.map(d=>last10(d.phone))),seen=new Set(),fresh=[];let dup=0;
    parseWb(wb).forEach(x=>{if(have.has(x.phone)||seen.has(x.phone)){dup++;return}seen.add(x.phone);fresh.push(x)});
    pend=fresh;
    if(!fresh.length){open(`<p class="big">कोई नया नंबर नहीं मिला</p><div class="ph" style="margin-top:6px">${dup?dup+" नंबर पहले से ऐप में हैं।":"फ़ाइल में 10 अंकों के मोबाइल नंबर नहीं दिखे।"}</div><div class="sm" style="margin-top:14px"><button id="cl">बंद करें</button></div>`);return}
    open(`<p class="big">पुराने नंबर जोड़ें</p>
    <div class="ph" style="margin-top:6px">${fresh.length} नए नंबर मिले${dup?" ("+dup+" पहले से ऐप में हैं, इसलिए छोड़ दिए)":""}</div>
    <div class="ph" style="margin-top:6px">जैसे: ${esc(fresh.slice(0,3).map(x=>x.name+" "+x.phone).join(", "))}</div>
    <label>किस तरह का संपर्क</label><select id="ic">${CATS.map(c=>`<option ${c[0]==="ग्राहक"?"selected":""}>${c[0]}</option>`).join("")}</select>
    <button class="save" id="idoit">${fresh.length} नंबर जोड़ें</button>
    <div class="sm" style="margin-top:10px"><button id="cl">रद्द करें</button></div>`);
  }catch(e){alert("फ़ाइल नहीं पढ़ पाए। .xlsx या .csv फ़ाइल चुनें।")}
  $("imf").value="";
}
async function runImport(){
  const cat=$("ic").value,recs=pend.map(x=>({id:"ig"+x.phone,name:x.name,phone:x.phone,cat,note:"पुराना ग्राहक"}));
  data.push(...recs);cache();render();
  $("sheet").innerHTML=`<p class="big">नंबर सेव हो रहे हैं…</p><div class="ph" id="ipr" style="margin-top:8px">0 / ${recs.length}</div><div class="ph" style="margin-top:8px">कृपया यह स्क्रीन बंद न करें।</div>`;
  let i=0,done=0,fail=0;
  const w=async()=>{while(i<recs.length){const r=recs[i++];try{const x=await jsonp({action:"save",...r});if(!(x&&x.ok))fail++}catch(e){fail++}done++;const p=$("ipr");if(p)p.textContent=done+" / "+recs.length}};
  await Promise.all([w(),w(),w()]);
  pend=[];
  $("sheet").innerHTML=`<p class="big">${fail?"काम पूरा, कुछ नंबर रह गए":"सब नंबर जुड़ गए"}</p><div class="ph" style="margin-top:8px">${recs.length-fail} नंबर शीट में सेव हुए${fail?", "+fail+" सेव नहीं हुए (दोबारा वही फ़ाइल चुनेंगे तो सिर्फ़ रहे हुए नंबर आएँगे)":""}।</div><div class="sm" style="margin-top:14px"><button id="cl">बंद करें</button></div>`;
  setStatus(fail?"कुछ नंबर सेव नहीं हुए":"शीट में सेव हो गया");
}

document.addEventListener("click",e=>{
  const t=e.target.closest("button");if(!t)return;
  if(t.id==="open-chatgpt-btn"){
    const prompt=`Extract customer transaction details from this image and return ONLY in this exact format (one line per transaction):

Name: [customer name] | Amount: [amount in numbers only] | Date: [YYYY-MM-DD format] | Time: [HH:MM AM/PM format]

Rules:
- Extract only the name (no titles like Mr, Mrs, Shri)
- Amount should be numbers only
- Date should be YYYY-MM-DD (example: 2026-10-28)
- Time should be in HH:MM AM/PM format (example: 2:30 PM)
- If any field is missing, write "unknown"

Example output:
Name: Raj | Amount: 500 | Date: 2026-10-28 | Time: 2:30 PM
Name: Priya | Amount: 300 | Date: 2026-10-28 | Time: 3:15 PM`;
    navigator.clipboard.writeText(prompt);
    alert("Prompt copied! Open ChatGPT app now");
  }
  else if(t.id==="open-chatgpt"){
    const prompt=$("prompt-text").value;
    navigator.clipboard.writeText(prompt).then(()=>{
      window.open("https://chat.openai.com","_blank");
    }).catch(()=>{alert("Error copying")});
  }
  else if(t.id==="mode-contacts"){
    $("mode-contacts").style.background="#C8102E";
    $("mode-contacts").style.color="#fff";
    $("mode-contacts").style.borderColor="#C8102E";
    $("mode-tracker").style.background="var(--card)";
    $("mode-tracker").style.color="var(--ink)";
    $("mode-tracker").style.borderColor="var(--line)";
    $("section-contacts").style.display="block";
    $("section-tracker").style.display="none";
  }
  else if(t.id==="mode-tracker"){
    $("mode-tracker").style.background="#C8102E";
    $("mode-tracker").style.color="#fff";
    $("mode-tracker").style.borderColor="#C8102E";
    $("mode-contacts").style.background="var(--card)";
    $("mode-contacts").style.color="var(--ink)";
    $("mode-contacts").style.borderColor="var(--line)";
    $("section-contacts").style.display="none";
    $("section-tracker").style.display="block";
    renderTracker();
  }
  else if(t.id==="tracker-add"){
    const text=$("tracker-input").value;
    if(!text.trim()){alert("Please paste some data");return}
    const newTrans=parseTrackerInput(text);
    if(!newTrans.length){alert("Please use correct format");return}
    trackerData.push(...newTrans);
    cacheTracker();
    $("tracker-input").value="";
    alert(`${newTrans.length} transactions added!`);
    renderTracker();
  }
  else if(t.id==="tracker-clear"){
    if(confirm("Delete all data?")){
      trackerData=[];
      cacheTracker();
      alert("All data deleted");
      renderTracker();
    }
  }
  else if(t.id==="mc")manage();
  else if(t.id==="imp")$("imf").click();
  else if(t.id==="idoit")runImport();
  else if(t.id==="ca")addCat();
  else if(t.dataset.cr!==undefined)renCat(+t.dataset.cr);
  else if(t.dataset.cd!==undefined)delCat(+t.dataset.cd);
  else if(t.dataset.c){filter=t.dataset.c;render()}
  else if(t.classList.contains("row"))view(t.dataset.id);
  else if(t.id==="add")form();
  else if(t.id==="cl")close();
  else if(t.id==="rf")load();
  else if(t.id==="st")setup();
  else if(t.id==="su"){const u=$("fu").value.trim();if(!/^https:\/\/script\.google\.com\/.+\/exec$/.test(u)){alert("लिंक https://script.google.com/... से शुरू होकर /exec पर खत्म होनी चाहिए");return}
    api=u;try{localStorage.setItem(URLK,u)}catch(_){}close();load()}
  else if(t.dataset.e)form(t.dataset.e);
  else if(t.dataset.d){if(confirm("यह संपर्क हटा दें?")){const id=t.dataset.d;data=data.filter(x=>x.id!==id);delete payments[id];cache();cachePayments();close();render();push({action:"delete",id})}}
  else if(t.id==="addpay")addPaymentForm(t.dataset.id);
  else if(t.id==="savepay"){
    const id=t.dataset.id,amt=parseFloat($("payamt").value);
    if(!amt||amt<=0){alert("सही रकम लिखें");return}
    if(!payments[id])payments[id]=[];
    payments[id].push({amount:amt,date:$("paydate").value});
    cachePayments();close();view(id);push({action:"payment",id,amount:amt,date:$("paydate").value});
  }
  else if(t.dataset.dp){
    const [id,date]=t.dataset.dp.split("|");
    if(confirm("यह भुगतान हटा दें?")){
      payments[id]=payments[id].filter(p=>p.date!==date);
      cachePayments();view(id);
    }
  }
  else if(t.id==="sv"){
    const name=$("fn").value.trim(),phone=$("fp").value.trim();
    if(!name||digits(phone).length<10){alert("नाम और कम से कम 10 अंकों का नंबर लिखें");return}
    const rec={id:t.dataset.id||("c"+Date.now()),name,phone,cat:$("fc").value,note:$("fo").value.trim()};
    const i=data.findIndex(x=>x.id===rec.id);i>=0?data[i]=rec:data.push(rec);
    cache();close();render();push({action:"save",...rec});
  }
});
