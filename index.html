<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111827">
<title>Momos Counter</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f3f4f6;color:#111827}.wrap{max-width:720px;margin:auto;padding:14px}.card{background:#fff;border-radius:18px;padding:18px;margin:12px 0;box-shadow:0 2px 12px #0001}h1,h2{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}input,button{font:inherit;padding:12px;border-radius:11px;border:1px solid #d1d5db;width:100%}button{background:#111827;color:#fff;border:0;font-weight:700;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}.secondary{background:#e5e7eb;color:#111827}.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{flex:1}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #eee}.item:last-child{border-bottom:0}.qty{display:flex;align-items:center;gap:8px}.qty button{width:44px;padding:8px;font-size:20px}.qty b{min-width:28px;text-align:center}.big{font-size:30px;font-weight:800}.muted{color:#6b7280;font-size:13px}.ok{color:#166534}.err{color:#b91c1c}.hidden{display:none}.pill{display:inline-block;padding:4px 8px;border-radius:999px;background:#eef2ff;font-size:12px}.row{display:flex;gap:8px}.row>*{flex:1}.smallbtn{padding:9px;font-size:14px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div id="login" class="card"><h1>🥟 Momos Counter</h1><p class="muted">Owner / Waiter Login</p><input id="uid" placeholder="User ID" autocomplete="username"><br><br><input id="pin" placeholder="4-digit PIN" type="password" inputmode="numeric" maxlength="4" autocomplete="current-password"><br><br><button id="loginBtn" onclick="login()">Login</button><p id="loginMsg" class="err"></p></div>
<div id="app" class="hidden"><div class="card"><div class="row"><div><h1 id="hello"></h1><span class="pill" id="role"></span></div><button class="secondary" onclick="logout()">Logout</button></div></div>
<div id="waiterView" class="hidden"><div class="card"><h2>Today's Order</h2><div id="items"><p class="muted">Loading menu...</p></div><br><button id="saveBtn" onclick="submitSale()">SAVE ORDER</button><p id="msg" class="muted"></p></div></div>
<div id="ownerView" class="hidden"><div class="tabs"><button onclick="showOwner('summary')">Sales</button><button onclick="showOwner('menu')">Menu</button><button onclick="showOwner('users')">Waiters</button></div><div id="summary" class="card"><h2>Today's Sales</h2><div class="big" id="total">₹0</div><div id="summaryItems"><p class="muted">Loading...</p></div></div><div id="menu" class="card hidden"><h2>Menu Management</h2><button onclick="addItem()">+ Add Item</button><div id="menuList"><p class="muted">Loading...</p></div></div><div id="users" class="card hidden"><h2>Waiter Management</h2><button onclick="addUser()">+ Add Waiter</button><div id="userList"><p class="muted">Loading...</p></div></div></div>
</div></div>
<script>
const API='https://script.google.com/macros/s/AKfycby2NU744rrbAqvJIDB-YNAn62tSkdEUEyCATuNFOrePON0-4PxmtwBEojYf_Hd5VJPG/exec';
let me=null,items=[],cart={},savingSale=false;
const $=id=>document.getElementById(id),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{maximumFractionDigits:2});
function api(action,params={}){return new Promise((resolve,reject)=>{const cb='cb_'+Date.now()+'_'+Math.random().toString(36).slice(2),script=document.createElement('script');window[cb]=data=>{delete window[cb];script.remove();if(!data||data.success===false)reject(new Error(data&&data.error||'Server error'));else resolve(data)};script.onerror=()=>{delete window[cb];script.remove();reject(new Error('Google Sheets connection failed'))};script.src=API+'?'+new URLSearchParams({action,callback:cb,...params});document.body.appendChild(script)})}
async function login(){if($('loginBtn').disabled)return;$('loginMsg').textContent='';$('loginBtn').disabled=true;$('loginBtn').textContent='Logging in...';try{const r=await api('login',{userId:$('uid').value.trim(),pin:$('pin').value.trim()});me={...r.user,pin:$('pin').value.trim()};sessionStorage.setItem('momosUser',JSON.stringify(me));start()}catch(e){$('loginMsg').textContent=e.message}finally{$('loginBtn').disabled=false;$('loginBtn').textContent='Login'}}
function logout(){sessionStorage.removeItem('momosUser');location.reload()}
function start(){$('login').classList.add('hidden');$('app').classList.remove('hidden');$('hello').textContent='Hello, '+me.name;$('role').textContent=me.role==='owner'?'OWNER':'WAITER';if(me.role==='waiter'){$('waiterView').classList.remove('hidden');loadWaiter()}else{$('ownerView').classList.remove('hidden');loadOwner()}}
async function loadWaiter(){const key='momosItemsCache';try{const cached=localStorage.getItem(key);if(cached){const a=JSON.parse(cached);if(Array.isArray(a)){items=a.filter(x=>x.active);renderWaiter()}}const r=await api('items');items=r.items.filter(x=>x.active);localStorage.setItem(key,JSON.stringify(r.items));renderWaiter();$('msg').textContent=''}catch(e){if(!items.length){$('items').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}}
function renderWaiter(){$('items').innerHTML=items.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} / plate</div></div><div class="qty"><button onclick="changeQty('${x.id}',-1)">−</button><b>${cart[x.id]||0}</b><button onclick="changeQty('${x.id}',1)">+</button></div></div>`).join('')||'<p class="muted">No active items.</p>'}
function changeQty(id,d){cart[id]=Math.max(0,(cart[id]||0)+d);if(!cart[id])delete cart[id];renderWaiter()}
async function submitSale(){if(savingSale)return;const selected=Object.entries(cart).map(([id,qty])=>({id,qty}));if(!selected.length){$('msg').textContent='Pehle kam se kam 1 item select karo.';$('msg').className='err';return}savingSale=true;$('saveBtn').disabled=true;$('saveBtn').textContent='SAVING...';$('msg').textContent='Saving...';$('msg').className='muted';const requestId='R'+Date.now()+'_'+Math.random().toString(36).slice(2);try{const r=await api('submitSale',{userId:me.id,pin:me.pin,requestId,cart:JSON.stringify(selected)});$('msg').textContent='Saved ✓ Total '+money(r.total);$('msg').className='ok';cart={};renderWaiter()}catch(e){$('msg').textContent=e.message;$('msg').className='err'}finally{savingSale=false;$('saveBtn').disabled=false;$('saveBtn').textContent='SAVE ORDER'}}
function showOwner(tab){['summary','menu','users'].forEach(x=>$(x).classList.toggle('hidden',x!==tab))}
async function loadOwner(){await Promise.all([loadSummary(),loadMenu(),loadUsers()])}
async function loadSummary(){try{const r=await api('summary',{userId:me.id,pin:me.pin});$('total').textContent=money(r.total);$('summaryItems').innerHTML=r.items.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${x.qty} plates</div></div><b>${money(x.revenue)}</b></div>`).join('')||'<p class="muted">No sales today.</p>'}catch(e){$('summaryItems').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function loadMenu(){try{const r=await api('items');items=r.items;localStorage.setItem('momosItemsCache',JSON.stringify(r.items));$('menuList').innerHTML=items.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${money(x.price)} / plate · ${x.active?'Active':'Inactive'}</div></div><div class="row"><button class="smallbtn" onclick="editItem('${x.id}')">Edit</button><button class="smallbtn secondary" onclick="toggleItem('${x.id}',${!x.active})">${x.active?'Disable':'Enable'}</button></div></div>`).join('')||'<p class="muted">No items yet.</p>'}catch(e){$('menuList').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function addItem(){const name=prompt('Item name?');if(!name)return;const price=prompt('Price per plate?');if(price===null)return;try{await api('addItem',{userId:me.id,pin:me.pin,name,price});await loadMenu()}catch(e){alert(e.message)}}
async function editItem(id){const x=items.find(i=>i.id===id);if(!x)return;const name=prompt('Item name',x.name);if(name===null)return;const price=prompt('New price per plate',x.price);if(price===null)return;try{await api('editItem',{userId:me.id,pin:me.pin,itemId:id,name,price});await loadMenu()}catch(e){alert(e.message)}}
async function toggleItem(id,active){try{await api('toggleItem',{userId:me.id,pin:me.pin,itemId:id,active:String(active)});await loadMenu()}catch(e){alert(e.message)}}
async function loadUsers(){try{const r=await api('users',{userId:me.id,pin:me.pin});$('userList').innerHTML=r.users.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><div class="muted">${x.id} · ${x.active?'Active':'Inactive'}</div></div><button onclick="toggleUser('${x.id}',${!x.active})">${x.active?'Disable':'Enable'}</button></div>`).join('')||'<p class="muted">No waiters yet.</p>'}catch(e){$('userList').innerHTML='<p class="err">'+esc(e.message)+'</p>'}}
async function addUser(){const name=prompt('Waiter name?');if(!name)return;const waiterPin=prompt('4-digit PIN?');if(!waiterPin)return;if(!/^\d{4}$/.test(waiterPin)){alert('PIN exactly 4 digits ka hona chahiye.');return}try{const r=await api('addUser',{userId:me.id,pin:me.pin,name,waiterPin});alert('Waiter created!\n\nID: '+r.user.id+'\nPIN: '+waiterPin);await loadUsers()}catch(e){alert(e.message)}}
async function toggleUser(id,active){try{await api('toggleUser',{userId:me.id,pin:me.pin,targetId:id,active:String(active)});await loadUsers()}catch(e){alert(e.message)}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'})[m])}
const saved=sessionStorage.getItem('momosUser');if(saved){try{me=JSON.parse(saved);start()}catch(e){sessionStorage.removeItem('momosUser')}}
</script></body></html>
